  # ---- Basic utility methods ----
  - { method: "<java.lang.String: java.lang.String toString()>" }
  - { method: "<java.lang.String: int length()>" }
  - { method: "<java.lang.StringBuilder: void <init>()>" }
  - { method: "<java.util.Iterator: boolean hasNext()>" }
  - { method: "<java.util.UUID: java.util.UUID randomUUID()>" }
  - { method: "<java.util.Enumeration: boolean hasMoreElements()>" }

  # ---- JDK internal noise methods ----
  - { method: "<java.util.HashMap: java.util.HashMap$Node[] resize()>" }
  - { method: "<java.beans.PropertyChangeSupport: void readObject(java.io.ObjectInputStream)>" }
  - { method: "<java.beans.VetoableChangeSupport: void readObject(java.io.ObjectInputStream)>" }
  - { method: "<java.security.BasicPermissionCollection: void readObject(java.io.ObjectInputStream)>" }
  - { method: "<java.lang.System: java.lang.SecurityManager getSecurityManager()>" }
  - { method: "<java.lang.SecurityManager: void checkRead(java.lang.String)>" }
  - { method: "<sun.util.logging.PlatformLogger: sun.util.logging.PlatformLogger getLogger(java.lang.String)>" }
  - { method: "<javax.swing.text.DefaultStyledDocument: void readObject(java.io.ObjectInputStream)>" }

  # ---- Classes to fully ignore (no taint propagation) ----
  - { class: "java.lang.Object" }
  - { class: "java.lang.Class" }
  - { class: "java.lang.String" }
  - { class: "sun.rmi.server.MarshalInputStream" }
  - { class: "java.io.ObjectInputStream" }
  - { class: "java.io.ObjectOutputStream" }

  # ================================================================
  # GadgetHunter-specific noise reduction (major improvement)
  # Aggressively filter JDK and framework classes that produce
  # false chain paths in the Gleipner benchmark
  # ================================================================

  # ---- Swing/AWT (huge noise source: 434+ edges in depth chains) ----
  - { classMethod: "javax.swing" }
  - { classMethod: "java.awt" }
  - { classMethod: "sun.awt" }
  - { classMethod: "com.sun.java.swing" }

  # ---- java.time (148+ edges from ZoneId dispatch noise) ----
  - { classMethod: "java.time" }

  # ---- sun.reflect (1011+ edges from AnnotationInvocationHandler) ----
  # Note: We keep java.lang.reflect.* for Method.invoke / Constructor
  - { classMethod: "sun.reflect.annotation" }

  # ---- Locale and i18n noise ----
  - { classMethod: "sun.util.locale" }
  - { classMethod: "java.util.Locale" }
  - { classMethod: "sun.util.calendar" }

  # ---- Networking, NIO, SQL (irrelevant for Gleipner) ----
  - { classMethod: "java.net" }
  - { classMethod: "java.nio" }
  - { classMethod: "java.sql" }
  - { classMethod: "javax.sql" }
  - { classMethod: "javax.net" }
  - { classMethod: "sun.net" }

  # ---- RMI ----
  - { classMethod: "java.rmi" }
  - { classMethod: "sun.rmi" }

  # ---- JNDI / Naming (noise from Reference in some chains) ----
  - { classMethod: "javax.naming" }
  - { classMethod: "com.sun.jndi" }

  # ---- XML / XSLT ----
  - { classMethod: "javax.xml" }
  - { classMethod: "org.xml.sax" }
  - { classMethod: "org.w3c.dom" }
  - { classMethod: "com.sun.org.apache.xalan" }
  - { classMethod: "com.sun.org.apache.xerces" }
  - { classMethod: "com.sun.org.apache.xml" }
  - { classMethod: "com.sun.org.apache.xpath" }

  # ---- Scripting engines ----
  - { classMethod: "javax.script" }
  - { classMethod: "javax.el" }

  # ---- Security / crypto ----
  - { classMethod: "javax.crypto" }
  - { classMethod: "java.security" }
  - { classMethod: "sun.security" }

  # ---- Beans introspection noise ----
  - { classMethod: "com.sun.beans" }
  - { classMethod: "java.beans" }
  - { classMethod: "sun.reflect.misc" }

  # ---- JAR / ZIP handling ----
  - { classMethod: "java.util.jar" }
  - { classMethod: "java.util.zip" }

  # ---- Logging ----
  - { classMethod: "java.util.logging" }
  - { classMethod: "sun.util.logging" }

  # ---- Management / JMX ----
  - { classMethod: "javax.management" }
  - { classMethod: "java.lang.management" }
  - { classMethod: "com.sun.jmx" }

  # ---- Regex (not relevant) ----
  - { classMethod: "java.util.regex" }

  # ---- Math ----
  - { classMethod: "java.math" }

  # ---- Text formatting ----
  - { classMethod: "java.text" }

  # ---- Concurrent utilities beyond collections ----
  # Note: Keep ConcurrentHashMap.readObject as entry point
  - { classMethod: "java.util.concurrent.atomic" }
  - { classMethod: "java.util.concurrent.locks" }

  # ---- sun.misc internals ----
  - { classMethod: "sun.misc" }

  # ---- Compiler / annotation processing ----
  - { classMethod: "javax.annotation" }
  - { classMethod: "javax.tools" }

sanitizers: []
