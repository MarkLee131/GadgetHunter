  - { method: "<java.io.ObjectInputStream: int read()>" }
  - { method: "<java.io.ObjectInputStream: int readInt()>" }
  - { method: "<java.io.ObjectInputStream: short readShort()>" }
  - { method: "<java.io.ObjectInputStream: int readUnsignedShort()>" }
