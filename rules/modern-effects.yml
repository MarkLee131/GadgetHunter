  - {method: "<java.io.File: void <init>(java.io.File,java.lang.String)>", from: 1, to: base}
  - {method: "<java.io.File: java.nio.file.Path toPath()>", from: base, to: result}
  - {method: "<java.nio.file.Paths: java.nio.file.Path get(java.lang.String,java.lang.String[])>", from: 0, to: result}
  - {method: "<java.net.URL: void <init>(java.lang.String)>", from: 0, to: base}
  - {method: "<java.beans.XMLDecoder: void <init>(java.io.InputStream)>", from: 0, to: base}
  - {method: "<javax.el.ExpressionFactory: javax.el.ValueExpression createValueExpression(javax.el.ELContext,java.lang.String,java.lang.Class)>", from: 1, to: result}
  - {method: "<javax.el.ExpressionFactory: javax.el.MethodExpression createMethodExpression(javax.el.ELContext,java.lang.String,java.lang.Class,java.lang.Class[])>", from: 1, to: result}
  - {method: "<org.springframework.expression.ExpressionParser: org.springframework.expression.Expression parseExpression(java.lang.String)>", from: 0, to: result}
  - {method: "<org.mvel2.MVEL: java.io.Serializable compileExpression(java.lang.String)>", from: 0, to: result}
  - {method: "<com.caucho.hessian.io.HessianInput: void <init>(java.io.InputStream)>", from: 0, to: base}
  - {method: "<com.caucho.hessian.io.Hessian2Input: void <init>(java.io.InputStream)>", from: 0, to: base}

